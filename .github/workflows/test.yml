name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSfL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Import project
        run: |
          set -euo pipefail
          ~/godot/godot --headless --path . --import 2>&1 | tee import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" import.log

      - name: Build failure safeguards
        run: |
          python3 tools/tests/test_build.py
          python3 tools/tests/test_validate_pack.py
          node --test tools/tests/test_download_worker.mjs

      - name: Gameplay tests
        run: |
          set -euo pipefail
          for t in test_all test_save_recovery; do
            ~/godot/godot --headless --path . --fixed-fps 60 --script "res://tests/$t.gd" 2>&1 | tee "$t.log"
            ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" "$t.log"
          done

      - name: Character and asset tests
        run: |
          set -euo pipefail
          # tests/test_motion_deformation.gd excluded — requires windowed renderer
          for t in test_gameplay_motion test_skeletal_character test_equipment_motion test_ranger_assets test_v31_assets test_animation_transitions test_audio_upgrade test_player_guidance test_platform_shortcuts test_village_presentation; do
            ~/godot/godot --headless --path . --fixed-fps 60 --script "res://tests/$t.gd" 2>&1 | tee "$t.log"
            ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" "$t.log"
          done

      - name: Thai and English localization
        run: |
          set -euo pipefail
          python3 tools/localization/validate_catalog.py
          for t in test_localization test_localized_gameplay test_localized_ui; do
            ~/godot/godot --headless --path . --script "res://tests/$t.gd" 2>&1 | tee "$t.log"
            ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" "$t.log"
          done
          # Recorded audio uses wall time; do not accelerate its timers.
          for t in test_voice_subtitles test_voice_locales test_radio_context; do
            ~/godot/godot --headless --path . --script "res://tests/$t.gd" 2>&1 | tee "$t.log"
            ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" "$t.log"
          done

      - name: Game UI navigation and feedback
        run: |
          set -euo pipefail
          for t in test_ui_navigation test_menu_ux test_gameplay_ui test_opening; do
            ~/godot/godot --headless --path . --script "res://tests/$t.gd" 2>&1 | tee "ui-$t.log"
            ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" "ui-$t.log"
          done

      - name: Smoke run
        run: |
          set -euo pipefail
          ~/godot/godot --headless --path . --fixed-fps 60 --quit-after 120 2>&1 | tee smoke.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" smoke.log
