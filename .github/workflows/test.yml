name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSfL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Import project
        run: ~/godot/godot --headless --path . --import || true

      - name: Gameplay tests
        run: ~/godot/godot --headless --path . --fixed-fps 60 --script res://tests/test_all.gd

      - name: Character and asset tests
        run: |
          set -e
          # tests/test_motion_deformation.gd excluded — requires windowed renderer
          for t in test_gameplay_motion test_skeletal_character test_equipment_motion test_ranger_assets test_v31_assets; do
            ~/godot/godot --headless --path . --fixed-fps 60 --script "res://tests/$t.gd"
          done

      - name: Smoke run
        run: |
          ~/godot/godot --headless --path . --fixed-fps 60 --quit-after 120 2>&1 | tee smoke.log
          ! grep -E "SCRIPT ERROR|Parse Error" smoke.log
